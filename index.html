<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <title>Rock paper scissors</title>
            <link rel="stylesheet" href="./style.css">
            <script src="./code.js" defer></script>
        </head>
        <body>
            <h1>Rock paper scissors game</h1>
            <p id="instructions">You'll play against the computer. The first one to get five points wins.</p>
            <h2>Make your choice</h2>
            <div class="buttons">
                <button id="rock">&#128074;</button>
                <button id="paper">&#128400;</button>
                <button id="scissors">&#9996;</button>
            </div>
            <div class="results">
                <div class="choices">
                    <p id="your-choice">&#129490; Your choice: ?</p>
                    <p id="computer-choice">&#128187; Computer choice: ?</p>
                </div>
                <p id="round-results">Round winner: ?</p>
                <div class="round">
                    <p id="round">Round: 0</p>
                    <p id="won">Won: 0</p>
                    <p id="lost">Lost: 0</p>
                    <p id="draw">Draw: 0</p>
                </div>
                <p id="final-winner"></p>
            </div>    
        </body>
    </html>
