<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <title>Rock paper scissors</title>
            <script src="./code.js" defer></script>
        </head>
        <body>
            <h1>Rock paper scissors game</h1>
            <p>You'll play against the computer. The first one to get five points wins.</p>
            <h2>Make your choice</h2>
            <div class="buttons">
                <button>&#128074;</button>
                <button>&#128400;</button>
                <button>&#9996;</button>
            </div>
            <div class="results">
                <div class="choices">
                    <p>Your choice: ?</p>
                    <p>Computer choice: ?</p>
                </div>
                <p id="round-reults">Round result: ?</p>
                <div class="round">
                    <p>Round: 0</p>
                    <p>Won: 0</p>
                    <p>Lost: 0</p>
                    <p>Draw: 0</p>
                </div>
                <p id="final-winner"></p>
            </div>    
        </body>
    </html>
